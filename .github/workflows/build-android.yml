{"name": "Build Android app", "on": {"workflow_dispatch": {}, "push": {"branches": ["main"], "tags": ["v*"]}}, "permissions": {"contents": "write"}, "jobs": {"android": {"runs-on": "ubuntu-latest", "defaults": {"run": {"working-directory": "android"}}, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 20}}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 17}}, {"name": "Install", "run": "npm install"}, {"name": "Create the Android project", "run": "npx cap add android"}, {"name": "Camera permission", "run": "sed -i 's|<application|<uses-permission android:name=\"android.permission.CAMERA\" />\\n    <uses-permission android:name=\"android.permission.INTERNET\" />\\n    <application|' android/app/src/main/AndroidManifest.xml"}, {"name": "Generate app icons", "run": "npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'"}, {"name": "Sync", "run": "npx cap sync android"}, {"name": "Build APK", "working-directory": "android/android", "run": "chmod +x gradlew && ./gradlew assembleDebug --no-daemon"}, {"name": "Rename APK", "run": "cp android/app/build/outputs/apk/debug/app-debug.apk GMK-Invoice.apk"}, {"name": "Upload build", "uses": "actions/upload-artifact@v4", "with": {"name": "GMK-Invoice-Android", "path": "android/GMK-Invoice.apk"}}, {"name": "Attach to GitHub Release (tags only)", "if": "startsWith(github.ref, 'refs/tags/v')", "uses": "softprops/action-gh-release@v2", "with": {"files": "android/GMK-Invoice.apk"}}]}}}
