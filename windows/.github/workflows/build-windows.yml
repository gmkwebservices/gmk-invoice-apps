{"name": "Build Windows app", "on": {"workflow_dispatch": {}, "push": {"branches": ["main"], "tags": ["v*"]}}, "permissions": {"contents": "write"}, "jobs": {"windows": {"runs-on": "windows-latest", "defaults": {"run": {"working-directory": "windows"}}, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 20}}, {"name": "Install", "run": "npm install"}, {"name": "Build installer and portable exe", "run": "npm run dist"}, {"name": "Upload build", "uses": "actions/upload-artifact@v4", "with": {"name": "GMK-Invoice-Windows", "path": "windows/dist/*.exe"}}, {"name": "Attach to GitHub Release (tags only)", "if": "startsWith(github.ref, 'refs/tags/v')", "uses": "softprops/action-gh-release@v2", "with": {"files": "windows/dist/*.exe"}}]}}}
